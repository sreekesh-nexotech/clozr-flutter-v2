name: clozrapp
description: "Clozr — mobile-first B2B CRM. Presentation layer."
publish_to: 'none'
version: 1.0.0+1

# NOTE: Technical_stack.md pins Flutter 3.24.5 / Dart 3.5.4. The generated
# scaffold declared `sdk: ^3.11.0`; that constraint is lowered here to match
# the documented, authoritative toolchain.
environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management (per Technical_stack.md)
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing (folder-structure doc specifies GoRouter)
  go_router: ^14.6.2

  # Responsiveness
  flutter_screenutil: ^5.9.3

  # Iconography — the design system uses Phosphor Icons
  phosphor_flutter: ^2.1.0

  # Charts for the dashboard widgets (bar / area / donut / sparkline)
  fl_chart: ^0.69.2

  # UI/UX
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0

  # Utilities
  intl: ^0.19.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Manrope
      fonts:
        # Variable font — Flutter maps fontWeight to the wght axis.
        - asset: assets/fonts/Manrope-VariableFont_wght.ttf
