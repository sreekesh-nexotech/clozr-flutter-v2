name: clozrapp
description: "Clozr — mobile-first B2B CRM. Presentation layer."
publish_to: 'none'
version: 1.0.0+1

# NOTE: Technical_stack.md pins Flutter 3.24.5 / Dart 3.5.4. The generated
# scaffold declared `sdk: ^3.11.0`; that constraint is lowered here to match
# the documented, authoritative toolchain.
environment:
  sdk: '>=3.5.0 <4.0.0'
  # Declares the toolchain this project actually builds against. Note that pub
  # does NOT enforce a root package's flutter constraint — a bare `flutter`
  # (rather than `fvm flutter`) will still re-resolve the whole lockfile against
  # whatever SDK is on PATH and only fail later, during compile, on
  # `IconData is a final class`. This line is documentation for humans and
  # tooling, not a guard. The guard is using `fvm`.
  #
  # Raising this bound means doing the toolchain migration in the README's
  # Toolchain section first — it is not a version bump on its own.
  flutter: '>=3.24.0 <3.25.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management (per Technical_stack.md)
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing (folder-structure doc specifies GoRouter)
  go_router: ^14.6.2

  # Responsiveness
  flutter_screenutil: ^5.9.3

  # Iconography — the design system uses Phosphor Icons
  phosphor_flutter: ^2.1.0

  # Charts for the dashboard widgets (bar / area / donut / sparkline)
  fl_chart: ^0.69.2

  # UI/UX
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0

  # Utilities
  intl: ^0.19.0
  equatable: ^2.0.5

  # Picking photos/files off the device for note attachments. One package for
  # both: `FileType.image` for the Photo action, `FileType.custom` (the types
  # the notes API accepts) for the File action.
  file_picker: ^8.1.7

  # Networking (per Technical_stack.md)
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0
  connectivity_plus: ^6.1.5

  # Local storage / caching (per Technical_stack.md)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Session tokens (per Technical_stack.md — never in Hive, per security rules)
  flutter_secure_storage: ^9.2.2

  # Hands a `tel:` number to the device dialler. The backend has no "place a
  # call" endpoint — dialling is the device's job, the API only logs that the
  # call happened (`POST /crm/call-logs/`).
  url_launcher: ^6.3.1

  # Crash reporting / performance monitoring. `sentry_dio` is the companion
  # integration that hangs off the single ApiService Dio — see
  # lib/core/monitoring/sentry_config.dart for the DSN and the PII rules.
  #
  # HELD at 8.x. Every sentry_flutter 9.x depends on `jni`, whose Gradle script
  # reads `flutter.ndkVersion` inside its `android {}` block — a property the
  # Flutter 3.24.5 Gradle plugin does not expose, so `assembleDebug` dies with
  # "Could not get unknown property 'flutter'". Pub won't catch this: 9.x
  # declares `flutter: '>=3.24.0'` and resolves happily, then fails at build.
  # 8.14.2 is the last release with no `jni` dependency. Moving to 9.x means
  # moving off the 3.24.5 pin first — see the Toolchain note in README.md for
  # why that pin exists.
  sentry_flutter: ^8.14.2
  sentry_dio: ^8.14.2

  # Play Store in-app update prompts (Android only — no-ops on iOS/mock).
  # Pinned below 5.x, which needs Dart ^3.12 — this repo is pinned to Flutter
  # 3.24.5 / Dart 3.5.4 (see the Toolchain note in README.md).
  in_app_update: ^4.2.5

  # Not used directly — constrained because sentry_flutter asks only for
  # `>=1.0.0` and pub would take 9.x, whose Gradle script hits the same
  # `flutter.compileSdkVersion` wall described above. 8.3.1 hardcodes
  # `compileSdk 34` and builds on 3.24.5. Drop this line when the toolchain pin
  # is lifted.
  package_info_plus: ^8.3.1
  path_provider: ^2.1.5
  open_file: ^3.5.11
  emoji_picker_flutter: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Manrope
      fonts:
        # Variable font — Flutter maps fontWeight to the wght axis.
        - asset: assets/fonts/Manrope-VariableFont_wght.ttf
